syntax = "proto3";

option java_package = "kr.co.core.datastore.proto";
option java_multiple_files = true;

message UserProfileProto {
  string uid = 1;
  string email = 2;
  string name = 3;
  GenderProto gender = 4;
  string birthday = 5;
  string address = 6;
  string phone_number = 7;
  string nickname = 8;
  string profile_photo_url = 9;
  int64 joined_at = 10;
  int64 last_modified_at = 11;
}

enum GenderProto {
  NONE = 0;
  MALE = 1;
  FEMALE = 2;
  OTHER = 3;
}